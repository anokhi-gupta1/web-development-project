<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
    <nav>
        <div class="logo">
            <img src="coder.png">
        </div>
        <div class="nav-link">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">phone</a></li>
                <li><a href="#">Accessories</a></li>
                <li><a href="#">cart</a></li>
            </ul>
        </div>
    </nav>
    <div class="information">
        <div class="overlay"></div>
        <img src="mobile.png" class="mobile">
        <div id="circle">
            <div class="feature one">
                <img src="camera.png" class="image" alt="">
                <div>
                <h1>Camera</h1>
                <p>12MP, Wide Angle</p>
                </div>
            </div>
            <div class="feature two">
                <img src="processor.png"class="image"alt="">
                <div>
                    <h1>processor</h1>
                    <p>Snapdragon Octa-core 11nm</p>
                    </div>
            </div>
            <div class="feature three">
                <img src="dispaly.png" class="image"alt="">
                <div>
                    <h1>display</h1>
                    <p>6.5" Mini-drop fullscreen</p>
                    </div>
            </div>
            <div class="feature four">
                <img src="battery.png"class="image" alt="">
                <div>
                    <h1>battery</h1>
                    <p>5000mAh,720hrs Standby</p>
                    </div>
            </div>
        </div>
    </div>
    <div class="controls">
        <img src="uparrow.png" id="upBtn" class="image">
        <h3>Features</h3>
        <img src="downarrow.png" id="downBtn" class="image">
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

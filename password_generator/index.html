<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="display">
            <h1 id="newPass"> </h1> 
            <button id="copyPass">copy</button>
        </div>
  
        <input type="range" name="" id="range" max="20" min="5" value="10">
        <!-- <button id="copyPass">copy</button> -->
        <p id="rangeVal" style="font-weight: 900;"> </p>
        <div id="choice" style="font-weight: 600">
            <input type="checkbox" name="capLet" id="capLet">
            <label for="capLet"> Uppercase</label><br>
            <input type="checkbox" name="smallLet" id="smallLet">
            <label for="smallLet"> Lowerrcase </label><br>
            <input type="checkbox" name="number" id="number">
            <label for="number"> Number</label><br>
            <input type="checkbox" name="symbol" id="symbol">
            <label for="symbol"> Symbol</label><br>
        </div>
        <button id="genPass" style="font-weight: 600; font-size: 20px;"> Generate Passward</button>
    </div>
 

    <script src="script.js">
       
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image Resizer</h1>
        <form id="resize-form">
            <div class="input-group">
                <img class="image" src="image-.png" id="image-preview">
                <input type="file" hidden id="image-upload" accept="image/*">
            </div>
            <div class="input-group">
                <label for="width">Width (px)</label>
                <input type="number" id="width" min="1">
            </div>
            <div class="input-group">
                <label for="height">Height (px)</label>
                <input type="number" id="height" min="1">
            </div>
            <div class="input-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="aspect-ratio">
                    Keep Original Aspect Ratio
                </label>
            </div>
            <div class="input-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="reduce-size">
                    Reduce Size
                </label>
            </div>
            <button type="button" class="resize-button">Resize Image</button>
            <a id="download-link" class="download-button" href="#" download="resized-image.png">Download Resized Image</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
